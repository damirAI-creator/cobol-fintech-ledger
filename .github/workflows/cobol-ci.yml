name: COBOL Automated Build Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Install GnuCOBOL Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gnucobol

    - name: Verify GnuCOBOL Version
      run: cobc --version

    - name: Compile COBOL Fintech Engine
      run: cobc -x -o ledger_engine ledger.cob

    - name: Run Batch Process MVP
      run: ./ledger_engine

    - name: Check Artifact Generation
      run: |
        if [ -f audit_report.txt ]; then
          echo "SUCCESS: audit_report.txt has been successfully generated by core engine!"
          cat audit_report.txt
        else
          echo "ERROR: audit_report.txt missing!"
          exit 1
        fi
